[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reaper-ai"
dynamic = ["version"]
description = "Local chat GUI, FastAPI layer and integrated stage runner (Ollama tool loop), single-user, loopback only."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Robert Backhaus" }]
dependencies = [
    "fastapi>=0.143.2,<1",
    "uvicorn>=0.54.0,<1",
    # Stage runner (reaper_ai.runner.stage_runner): Ollama/web HTTP calls.
    "requests>=2.32,<3",
    # Stage runner memory tools. The runner uses Basic Memory's internal client API
    # (mcp.clients, note_content_materialization) -- pinned to the tested minor line.
    "basic-memory>=0.23.2,<0.24",
    # basic-memory 0.23.2 pins the pre-releases fastmcp==4.0.0b1 (-> fastmcp-slim==4.0.0b1).
    # uv only accepts pre-releases that a first-party requirement names explicitly, so
    # declare both here (bounds only, the exact version stays basic-memory's choice);
    # otherwise `uv pip install` fails without --prerelease=allow.
    "fastmcp>=4.0.0b1,<5",
    "fastmcp-slim>=4.0.0b1,<5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
reaper-ai = "reaper_ai.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reaper_ai.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reaper_ai = ["web/*.html", "web/vendor/*"]
