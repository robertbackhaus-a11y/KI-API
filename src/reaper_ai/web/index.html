<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaper</title>
<link rel="stylesheet" href="/vendor/hljs-github.min.css" media="not all and (prefers-color-scheme: dark)">
<link rel="stylesheet" href="/vendor/hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --border: #e0ddd6;
    --accent: #8a6a4a;
    --accent-text: #ffffff;
    --user-bubble: #e9e5dc;
    --stage-bubble: #ffffff;
    --error: #b4433a;
    --success: #4a7a4a;
    --warn: #a9802e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #26241f;
      --text: #ece8e0;
      --text-dim: #9a958a;
      --border: #3a372f;
      --accent: #c9a876;
      --accent-text: #1c1b19;
      --user-bubble: #332f27;
      --stage-bubble: #26241f;
      --error: #e07a6f;
      --success: #7fc17f;
      --warn: #d9ac55;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  header .session-id { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  header .spacer { flex: 1; }

  #health { display: flex; gap: 10px; align-items: center; }
  #health .hitem { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
  #health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
  #health .dot.ok { background: var(--success); }
  #health .dot.down, #health .dot.missing { background: var(--error); }
  #health .dot.checking { background: var(--warn); }
  select, input[type=text] {
    font-size: 12px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
  }
  label.opt { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
  button {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--error); border-color: var(--error); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 72ch; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.stage { align-self: flex-start; background: var(--stage-bubble); border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.success { color: var(--success); border-color: var(--success); }
  .badge.error, .badge.wall_clock, .badge.max_iterations { color: var(--error); border-color: var(--error); }
  .badge.aborted, .badge.watchdog_timeout, .badge.incomplete { color: var(--warn); border-color: var(--warn); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  /* Markdown-Darstellung der Stage-Antworten */
  .msg .body.md { white-space: normal; display: block; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md table, .md blockquote, .md .code-wrap { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 12px 0 6px; line-height: 1.3; }
  .md h1 { font-size: 1.3em; } .md h2 { font-size: 1.18em; } .md h3 { font-size: 1.06em; }
  .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li > ul, .md li > ol { margin: 2px 0; }
  .md a { color: var(--accent); }
  .md blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--text-dim); }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--bg); }
  .md code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; }
  .md :not(pre) > code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .md .code-wrap { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .md .code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 3px 6px 3px 10px; font-size: 11px; color: var(--text-dim); background: var(--bg); border-bottom: 1px solid var(--border); }
  .md pre { margin: 0; overflow-x: auto; white-space: pre; }
  .md pre code.hljs { display: block; padding: 8px 10px; background: var(--bg); }
  button.copy-btn { font-size: 11px; padding: 1px 7px; }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; font-size: 11px; color: var(--text-dim); }
  details.raw pre { font-size: 11px; white-space: pre-wrap; color: var(--text-dim); max-height: 240px; overflow-y: auto; }

  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 160px;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #status-line { font-size: 12px; color: var(--text-dim); padding: 0 16px 8px; min-height: 16px; }
  .err { color: var(--error); }

  #body-row { flex: 1; display: flex; min-height: 0; }
  #main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #side-panel {
    width: 320px;
    flex: 0 0 auto;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 14px;
  }
  #side-panel.hidden { display: none; }
  #side-panel h2 { font-size: 12px; font-weight: 600; margin: 0 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .panel-section { margin-bottom: 20px; }
  .panel-section .meta-line { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .panel-section pre {
    font-size: 11px; white-space: pre-wrap; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; max-height: 400px; overflow-y: auto; margin: 0;
  }
  .panel-section .empty { font-size: 12px; color: var(--text-dim); font-style: italic; }
  #substages-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #substages-list li {
    font-size: 12px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; gap: 6px;
  }
  #substages-list .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  #substages-list li.done .sdot { background: var(--success); }
  #substages-list .stext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<header>
  <h1>Reaper</h1>
  <span class="session-id" id="session-id">-</span>
  <div id="health">
    <span class="hitem"><span class="dot checking" id="dot-api"></span>API</span>
    <span class="hitem"><span class="dot checking" id="dot-ollama"></span>Ollama</span>
    <span class="hitem"><span class="dot checking" id="dot-runner"></span>Runner</span>
  </div>
  <div class="spacer"></div>
  <label class="opt">Modell
    <select id="model">
      <option value="qwen3.8-q5:latest">qwen3.8-q5:latest (Haupt)</option>
      <option value="qwen3:8b">qwen3:8b (schnell)</option>
    </select>
  </label>
  <label class="opt">Projekt <input type="text" id="project" value="coding-v2" size="10"></label>
  <label class="opt"><input type="checkbox" id="think"> Reasoning</label>
  <button id="new-session">Neue Session</button>
  <button id="toggle-panel">Panel</button>
</header>

<div id="body-row">
  <div id="main-col">
    <div id="log"></div>
    <div id="status-line"></div>

    <div id="composer">
      <textarea id="input" placeholder="Nachricht an Reaper ..." rows="1"></textarea>
      <button id="abort" class="danger" style="display:none">Abbrechen</button>
      <button id="send" class="primary">Senden</button>
    </div>
  </div>

  <div id="side-panel" class="hidden">
    <div class="panel-section" id="panel-live">
      <h2>Aktivität</h2>
      <div class="meta-line" id="live-meta">Keine Stage aktiv.</div>
      <pre id="live-log"></pre>
    </div>
    <div class="panel-section" id="panel-substages">
      <h2>Hintergrundaufgaben</h2>
      <div class="meta-line" id="substages-meta">Keine Sub-Stages in dieser Stage.</div>
      <ul id="substages-list"></ul>
    </div>
    <div class="panel-section" id="panel-context">
      <h2>Kontext</h2>
      <div class="meta-line" id="context-meta">-</div>
      <pre id="context-preview"></pre>
    </div>
  </div>
</div>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/hljs-powershell.min.js"></script>
<script id="md-render">
// ---------------------------------------------------------------------------
// Markdown-Rendering der Stage-Antworten: marked (GFM) -> highlight.js fuer
// Codebloecke -> DOMPurify. Ergebnis wird pro Quelltext gecacht, damit
// renderHistory() (Recovery-Abgleich, Reload) nichts erneut parst/highlightet.
// Fehlen die Bibliotheken, faellt die Anzeige auf reinen Text zurueck.
// ---------------------------------------------------------------------------
const MD_CACHE_MAX = 300;
const mdCache = new Map();
const mdStats = { renders: 0 };  // Anzahl tatsaechlicher Parse-Vorgaenge (Tests)
// Auto-Erkennung fuer Codebloecke ohne Sprachangabe; bewusst ohne css/ini/markdown,
// die bei kurzen Python-/Shell-Schnipseln sonst haeufig faelschlich gewinnen.
const MD_AUTO_LANGS = ['python', 'powershell', 'bash', 'json', 'yaml', 'javascript', 'typescript',
  'xml', 'sql', 'csharp', 'java', 'go', 'rust', 'cpp', 'diff'];
// Nur Klassen, die das Rendering selbst erzeugt -- Klassen aus Modell-HTML
// koennten sonst GUI-Selektoren (.msg.stage, .meta, .body ...) imitieren.
const MD_CLASS_OK = /^(hljs(-[\w-]+)?|language-[\w+#-]+|[a-z]+_+)$/;
const mdReady = !!(window.marked && window.DOMPurify && window.hljs);

function mdEscape(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

if (mdReady) {
  marked.use({
    gfm: true,
    breaks: true,
    renderer: {
      code({ text, lang }) {
        const want = (lang || '').trim().split(/\s+/)[0].toLowerCase();
        let html = null;
        let name = '';
        try {
          if (want && hljs.getLanguage(want)) {
            html = hljs.highlight(text, { language: want, ignoreIllegals: true }).value;
            name = want;
          } else if (!want) {
            const auto = hljs.highlightAuto(text, MD_AUTO_LANGS);
            if (auto.language && auto.relevance >= 4) { html = auto.value; name = auto.language; }
          }
        } catch (e) { html = null; }
        if (html === null) { html = mdEscape(text); name = want; }
        const cls = name && /^[\w+#-]+$/.test(name) ? ` language-${name}` : '';
        return `<pre><code class="hljs${cls}">${html}</code></pre>\n`;
      },
      // Rohes HTML aus der Modellantwort nur als Text zeigen (Platzhalter wie
      // <datei> bleiben sichtbar); DOMPurify bleibt als zweite Sicherung.
      html({ text }) {
        return mdEscape(text);
      },
      // Keine externen Bilder nachladen -- als Link darstellen.
      image({ href, title, text }) {
        return `<a href="${mdEscape(href || '')}">${mdEscape(text || title || href || 'Bild')}</a>`;
      },
    },
  });

  DOMPurify.addHook('uponSanitizeAttribute', (node, data) => {
    if (data.attrName === 'class') {
      const kept = data.attrValue.split(/\s+/).filter(c => MD_CLASS_OK.test(c));
      if (kept.length) data.attrValue = kept.join(' ');
      else data.keepAttr = false;
    }
  });
  DOMPurify.addHook('afterSanitizeAttributes', (node) => {
    if (node.tagName === 'A' && node.hasAttribute('href')) {
      node.setAttribute('target', '_blank');
      node.setAttribute('rel', 'noopener noreferrer');
    }
    // Nur deaktivierte GFM-Task-Checkboxen zulassen.
    if (node.tagName === 'INPUT' && !(node.getAttribute('type') === 'checkbox' && node.hasAttribute('disabled'))) {
      node.remove();
    }
  });
}

const MD_PURIFY_CFG = {
  USE_PROFILES: { html: true },
  FORBID_TAGS: ['style', 'img', 'form', 'button', 'textarea', 'select', 'option', 'video', 'audio', 'source', 'picture'],
  FORBID_ATTR: ['style', 'id', 'name'],
  ALLOW_DATA_ATTR: false,
};

// Liefert fertiges, bereinigtes HTML (inkl. Code-Kopf mit Kopieren-Button)
// oder null, wenn die Bibliotheken fehlen.
function renderMarkdown(src) {
  if (!mdReady) return null;
  if (mdCache.has(src)) {
    const hit = mdCache.get(src);
    mdCache.delete(src);
    mdCache.set(src, hit);  // LRU: zuletzt benutzt nach hinten
    return hit;
  }
  mdStats.renders += 1;
  let html;
  try {
    html = DOMPurify.sanitize(marked.parse(src), MD_PURIFY_CFG);
  } catch (e) {
    return null;
  }
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  tpl.content.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    const m = code && /(?:^|\s)language-([\w+#-]+)/.exec(code.className);
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    const head = document.createElement('div');
    head.className = 'code-head';
    const label = document.createElement('span');
    label.textContent = m ? m[1] : 'Code';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy-btn';
    btn.dataset.copy = 'code';
    btn.textContent = 'Kopieren';
    head.append(label, btn);
    pre.replaceWith(wrap);
    wrap.append(head, pre);
  });
  const out = tpl.innerHTML;
  mdCache.set(src, out);
  if (mdCache.size > MD_CACHE_MAX) mdCache.delete(mdCache.keys().next().value);
  return out;
}

// Setzt den Antworttext eines .body-Elements; unveraenderter Text wird nicht
// erneut gesetzt.
function setMarkdownBody(body, src) {
  if (body._mdSrc === src) return;
  const html = renderMarkdown(src);
  if (html === null) {
    body.classList.remove('md');
    body.textContent = src;
  } else {
    body.classList.add('md');
    body.innerHTML = html;
  }
  body._mdSrc = src;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* Fallback unten */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
</script>
<script>
const API = location.origin;
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status-line');
const sessionIdEl = document.getElementById('session-id');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const abortBtn = document.getElementById('abort');
const newSessionBtn = document.getElementById('new-session');
const modelSel = document.getElementById('model');
const projectInput = document.getElementById('project');
const thinkBox = document.getElementById('think');
const togglePanelBtn = document.getElementById('toggle-panel');
const sidePanel = document.getElementById('side-panel');
const contextMetaEl = document.getElementById('context-meta');
const contextPreviewEl = document.getElementById('context-preview');
const liveMetaEl = document.getElementById('live-meta');
const liveLogEl = document.getElementById('live-log');
const substagesMetaEl = document.getElementById('substages-meta');
const substagesListEl = document.getElementById('substages-list');

let sessionId = null;
let stageRunning = false;

function safeLocalStorage(fn, fallback) {
  try { return fn(); } catch (e) { return fallback; }
}

function loadPrefs() {
  const model = safeLocalStorage(() => localStorage.getItem('reaper_model'), null);
  const project = safeLocalStorage(() => localStorage.getItem('reaper_project'), null);
  const think = safeLocalStorage(() => localStorage.getItem('reaper_think'), null);
  if (model) modelSel.value = model;
  if (project) projectInput.value = project;
  if (think !== null) thinkBox.checked = think === '1';
}
function savePrefs() {
  safeLocalStorage(() => {
    localStorage.setItem('reaper_model', modelSel.value);
    localStorage.setItem('reaper_project', projectInput.value);
    localStorage.setItem('reaper_think', thinkBox.checked ? '1' : '0');
  }, null);
}
[modelSel, projectInput, thinkBox].forEach(el => el.addEventListener('change', savePrefs));

function applyPanelState(open) {
  sidePanel.classList.toggle('hidden', !open);
  togglePanelBtn.textContent = open ? 'Panel ausblenden' : 'Panel';
}
togglePanelBtn.addEventListener('click', () => {
  const open = sidePanel.classList.contains('hidden');
  applyPanelState(open);
  safeLocalStorage(() => localStorage.setItem('reaper_panel_open', open ? '1' : '0'), null);
  if (open) refreshContextPreview();
});

async function refreshContextPreview() {
  if (!sessionId) return;
  try {
    const r = await fetch(`${API}/sessions/${sessionId}/context`, { cache: 'no-store' });
    if (!r.ok) throw new Error('context http ' + r.status);
    const data = await r.json();
    contextMetaEl.textContent = `${data.turns_included} von max. ${data.max_turns} Turns`;
    contextPreviewEl.textContent = data.preview || '';
    contextPreviewEl.style.display = data.preview ? '' : 'none';
    if (!data.preview) {
      contextMetaEl.textContent += ' -- noch kein Verlauf (erste Nachricht dieser Session).';
    }
  } catch (e) {
    contextMetaEl.textContent = 'Kontext nicht ladbar: ' + e;
    contextPreviewEl.textContent = '';
  }
}

function setStatus(text, isError) {
  statusEl.textContent = text || '';
  statusEl.className = isError ? 'err' : '';
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function addStageMessage(stageId) {
  const div = document.createElement('div');
  div.className = 'msg stage';
  if (stageId) div.dataset.stageId = stageId;
  div.innerHTML = '<span class="body">...</span><div class="meta"><span class="badge running">läuft</span></div>';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function findStageDiv(stageId) {
  if (!stageId) return null;
  return Array.from(logEl.querySelectorAll('.msg.stage'))
    .find(d => d.dataset.stageId === stageId) || null;
}

// Idempotent: mehrfacher Aufruf (SSE + Abort-Antwort + Recovery-Poll) fuer
// dieselbe Stage erzeugt keine doppelten Details-Bloecke.
function updateStageMessage(div, stage) {
  const body = div.querySelector('.body');
  const meta = div.querySelector('.meta');
  div.querySelectorAll('details.raw').forEach(d => d.remove());
  if (stage.status === 'running') {
    body.classList.remove('md');
    body._mdSrc = undefined;
    body.textContent = '...';
    meta.innerHTML = '<span class="badge running">läuft</span>';
    return;
  }
  setMarkdownBody(body, stage.summary || '(keine Zusammenfassung)');
  const badge = `<span class="badge ${stage.status}">${stage.status}</span>`;
  const dur = stage.duration_s != null ? `<span>${stage.duration_s}s</span>` : '';
  meta.innerHTML = badge + dur
    + (stage.summary ? '<button type="button" class="copy-btn" data-copy="answer">Antwort kopieren</button>' : '');
  if (stage.stderr_tail) {
    const details = document.createElement('details');
    details.className = 'raw';
    details.innerHTML = `<summary>Details</summary><pre></pre>`;
    details.querySelector('pre').textContent = stage.stderr_tail;
    div.appendChild(details);
  }
}

// Kopieren-Buttons (Antwort + Codebloecke) per Event-Delegation: ueberlebt
// den kompletten Neuaufbau des Verlaufs durch renderHistory().
logEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button.copy-btn');
  if (!btn || !logEl.contains(btn)) return;
  let text = '';
  if (btn.dataset.copy === 'answer') {
    const body = btn.closest('.msg.stage')?.querySelector('.body');
    text = (body && body._mdSrc) || '';
  } else {
    const code = btn.closest('.code-wrap')?.querySelector('pre code');
    text = code ? code.textContent : '';
  }
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  const ok = text ? await copyText(text) : false;
  btn.textContent = ok ? 'Kopiert' : 'Kopieren fehlgeschlagen';
  setTimeout(() => { btn.textContent = label; }, 1500);
});

async function ensureSession() {
  const saved = safeLocalStorage(() => localStorage.getItem('reaper_session_id'), null);
  if (saved) {
    try {
      const r = await fetch(`${API}/sessions/${saved}`);
      if (r.ok) {
        sessionId = saved;
        const data = await r.json();
        renderHistory(data);
        sessionIdEl.textContent = sessionId;
        refreshContextPreview();
        // Nach Reload: laeuft serverseitig noch eine Stage, GUI in den
        // Laufzustand versetzen und das Ergebnis per Session-API nachladen
        // (der alte SSE-Stream ist weg; es wird NIE erneut gesendet).
        if ((data.stages || []).some(s => s.status === 'running')) {
          startRecovery('Stage läuft noch (nach Neuladen) – Ergebnis wird nachgeladen ...');
        }
        return;
      }
    } catch (e) { /* fall through to new session */ }
  }
  await createSession();
}

async function createSession() {
  const r = await fetch(`${API}/sessions`, { method: 'POST' });
  const data = await r.json();
  sessionId = data.session_id;
  safeLocalStorage(() => localStorage.setItem('reaper_session_id', sessionId), null);
  sessionIdEl.textContent = sessionId;
  logEl.innerHTML = '';
  setStatus('');
  refreshContextPreview();
}

// Server-Zustand ist die einzige Wahrheit: der Verlauf wird komplett aus
// GET /sessions/{id} neu aufgebaut (nie angehaengt) -- dadurch keine doppelten
// Nachrichten/Stage-Anzeigen, egal wie oft synchronisiert wird.
function renderHistory(session) {
  logEl.innerHTML = '';
  const stagesById = {};
  (session.stages || []).forEach(s => { stagesById[s.stage_id] = s; });
  (session.messages || []).forEach(m => {
    addUserMessage(m.content);
    const stage = stagesById[m.stage_id];
    if (stage) {
      const div = addStageMessage(stage.stage_id);
      updateStageMessage(div, stage);
    }
  });
  lastRenderSig = sessionSignature(session);
}

function sessionSignature(session) {
  return JSON.stringify([
    (session.messages || []).length,
    (session.stages || []).map(s => [s.stage_id, s.status]),
  ]);
}

function setRunningUi(on) {
  stageRunning = on;
  sendBtn.disabled = on;
  abortBtn.style.display = on ? 'inline-block' : 'none';
}

async function fetchSession(sid) {
  const r = await fetch(`${API}/sessions/${sid}`, { cache: 'no-store' });
  if (!r.ok) {
    const err = new Error('session http ' + r.status);
    err.status = r.status;
    throw err;
  }
  return r.json();
}

// ---------------------------------------------------------------------------
// Recovery: SSE-Stream verloren (Reload, Netzabbruch, Server-Neustart) ->
// Stage-Status per GET /sessions/{id} pollen, bis keine Stage mehr 'running'
// ist. Nur lesend: es wird NIE erneut POST /messages gesendet. Live-Logs der
// Zwischenzeit sind verloren (akzeptiert), das finale Ergebnis kommt aus der
// Session (auch aborted/watchdog_timeout/incomplete).
// ---------------------------------------------------------------------------
const RECOVERY_POLL_MS = 2000;
let recovering = false;
let lastRenderSig = null;
let sseActive = false;
// Optimistisch angezeigte Nachricht, deren POST die Antwort verloren hat:
// { text, messageCount, emptyPolls } -- wird aufgeloest, sobald der Server
// sie kennt (oder nach zwei Polls ohne sie als "nicht angenommen" verworfen).
let pendingSend = null;

function startRecovery(statusText) {
  setRunningUi(true);
  if (statusText) setStatus(statusText);
  if (recovering) return;
  recovering = true;
  const sid = sessionId;
  const tick = async () => {
    if (!recovering || sid !== sessionId) return;
    let session;
    try {
      session = await fetchSession(sid);
    } catch (e) {
      if (e.status === 404) {
        stopRecovery();
        setStatus('Session auf dem Server nicht mehr vorhanden.', true);
        return;
      }
      setStatus('Server nicht erreichbar – neuer Versuch ...', true);
      setTimeout(tick, RECOVERY_POLL_MS);
      return;
    }
    if (sid !== sessionId) return;
    const msgCount = (session.messages || []).length;
    if (pendingSend && msgCount > pendingSend.messageCount) {
      pendingSend = null;  // Server hat die Nachricht angenommen
    }
    if (sessionSignature(session) !== lastRenderSig) {
      renderHistory(session);
    }
    const running = (session.stages || []).find(s => s.status === 'running');
    if (pendingSend && !running) {
      pendingSend.emptyPolls += 1;
      if (pendingSend.emptyPolls >= 2) {
        // Server kennt die Nachricht nicht -> sie wurde nie ausgefuehrt.
        renderHistory(session);
        if (!input.value) input.value = pendingSend.text;
        pendingSend = null;
        stopRecovery();
        setStatus('Nachricht wurde nicht verarbeitet (Verbindung verloren) – bitte erneut senden.', true);
        return;
      }
    }
    if (running || pendingSend) {
      liveMetaEl.textContent = running
        ? `läuft (pid ${running.pid}) – Live-Log nach Verbindungsverlust nicht verfügbar.`
        : liveMetaEl.textContent;
      setTimeout(tick, RECOVERY_POLL_MS);
      return;
    }
    const last = (session.stages || []).slice(-1)[0];
    stopRecovery();
    setStatus('');
    if (last) liveMetaEl.textContent = `Letzte Stage beendet (${last.status}).`;
    refreshContextPreview();
  };
  tick();
}

function stopRecovery() {
  recovering = false;
  setRunningUi(false);
}

newSessionBtn.addEventListener('click', async () => {
  if (stageRunning) return;
  await createSession();
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
abortBtn.addEventListener('click', async () => {
  if (!sessionId) return;
  abortBtn.disabled = true;
  try {
    const r = await fetch(`${API}/sessions/${sessionId}/abort`, { method: 'POST' });
    if (r.ok) {
      // Endstatus direkt aus der Abort-Antwort anzeigen -- wichtig nach einem
      // Reload, wenn kein SSE-Stream mehr das Terminal-Event liefert.
      const data = await r.json();
      const div = data.stage && findStageDiv(data.stage.stage_id);
      if (div) updateStageMessage(div, data.stage);
    } else if (r.status === 409) {
      // Stage war schon beendet (natuerliches Ende kam zuvor) -> Status abgleichen.
      if (!sseActive) startRecovery();
    } else {
      setStatus(`Abbruch fehlgeschlagen: HTTP ${r.status}`, true);
    }
  } catch (e) { setStatus('Abbruch fehlgeschlagen: ' + e, true); }
  abortBtn.disabled = false;
  // Ohne aktiven SSE-Stream bestaetigt der Recovery-Poll den Endstatus.
  if (!sseActive && sessionId) startRecovery();
});

async function sendMessage() {
  const text = input.value.trim();
  if (!text || stageRunning || !sessionId) return;
  input.value = '';
  input.style.height = 'auto';
  const messageCount = logEl.querySelectorAll('.msg.user').length;
  const userDiv = addUserMessage(text);
  const stageDiv = addStageMessage();

  setRunningUi(true);
  setStatus('Verbinde ...');

  const body = {
    message: text,
    model: modelSel.value,
    project: projectInput.value || 'coding-v2',
    think: thinkBox.checked,
  };

  const sse = { started: false, completed: false };
  let lostError = null;
  sseActive = true;
  try {
    const resp = await fetch(`${API}/sessions/${sessionId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (resp.status === 409) {
      // Nicht angenommen: optimistische Anzeige entfernen (sonst Phantom-
      // Nachricht) und den tatsaechlich laufenden Stand vom Server holen.
      sseActive = false;
      userDiv.remove();
      stageDiv.remove();
      if (!input.value) input.value = text;
      startRecovery('Es läuft bereits eine Stage in dieser Session – Status wird geladen ...');
      return;
    }
    if (!resp.ok) {
      const errBody = await resp.text();
      sseActive = false;
      userDiv.remove();
      stageDiv.remove();
      if (!input.value) input.value = text;
      setRunningUi(false);
      setStatus(`Fehler ${resp.status}: ${errBody}`, true);
      return;
    }
    await readSseStream(resp.body, stageDiv, sse);
  } catch (e) {
    lostError = e;
  }
  sseActive = false;
  if (sse.completed) {
    setRunningUi(false);
    setStatus('');
    return;
  }
  // Stream abgerissen oder ohne Terminal-Event beendet: Stage laeuft ggf.
  // serverseitig weiter. NICHT erneut senden -- Status ueber die Session-API
  // abgleichen. War stage_started noch nicht da, ist unklar, ob der Server die
  // Nachricht angenommen hat -> pendingSend klaert das beim Pollen.
  if (!sse.started) pendingSend = { text, messageCount, emptyPolls: 0 };
  startRecovery('Verbindung unterbrochen' + (lostError ? ` (${lostError.message || lostError})` : '')
    + ' – Stage-Status wird vom Server nachgeladen ...');
}

async function readSseStream(bodyStream, stageDiv, sse) {
  const reader = bodyStream.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      handleSseFrame(frame, stageDiv, sse);
    }
  }
}

function handleSseFrame(frame, stageDiv, sse) {
  let eventType = 'message';
  let dataLine = null;
  frame.split('\n').forEach(line => {
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLine = line.slice(5).trim();
  });
  if (!dataLine) return;
  let data;
  try { data = JSON.parse(dataLine); } catch (e) { return; }

  if (eventType === 'stage_started') {
    sse.started = true;
    stageDiv.dataset.stageId = data.stage_id;
    setStatus(`Gestartet (pid ${data.pid}) ...`);
    liveMetaEl.textContent = `läuft (pid ${data.pid}) ...`;
    liveLogEl.textContent = '';
    substagesListEl.innerHTML = '';
    substagesMetaEl.textContent = 'Keine Sub-Stages in dieser Stage.';
  } else if (eventType === 'heartbeat') {
    setStatus(`läuft seit ${data.elapsed_s}s ...`);
  } else if (eventType === 'log_line') {
    liveLogEl.textContent += (liveLogEl.textContent ? '\n' : '') + data.text;
    liveLogEl.scrollTop = liveLogEl.scrollHeight;
    handleSubstageLogLine(data.text);
  } else if (eventType === 'stage_completed') {
    sse.completed = true;
    updateStageMessage(stageDiv, data);
    setStatus('');
    liveMetaEl.textContent = `Letzte Stage beendet (${data.status}).`;
    refreshContextPreview();
  }
  logEl.scrollTop = logEl.scrollHeight;
}

const HEALTH_POLL_MS = 5000;
const dotApi = document.getElementById('dot-api');
const dotOllama = document.getElementById('dot-ollama');
const dotRunner = document.getElementById('dot-runner');

// run_substage blockiert (subprocess.run) -- stage_runner.py loggt deshalb NICHTS
// waehrend eine Sub-Stage laeuft, nur einen Start-Marker (von uns ergaenzt) und am
// Ende die normale TOOL-run_substage(...)-Zeile (dispatch-Schleife, kommt erst NACH
// Abschluss). Client-seitiges Mustererkennen auf dem Log-Text, rein kosmetisch --
// main.py interpretiert den Log-Text selbst nirgends (Zielarchitektur-Konstante).
let openSubstages = [];
function handleSubstageLogLine(text) {
  const startMatch = text.match(/run_substage GESTARTET: (.*)$/);
  if (startMatch) {
    const li = document.createElement('li');
    li.innerHTML = `<span class="sdot"></span><span class="stext"></span>`;
    li.querySelector('.stext').textContent = startMatch[1];
    substagesListEl.appendChild(li);
    openSubstages.push(li);
    substagesMetaEl.textContent = `${openSubstages.length} Sub-Stage(s) in dieser Stage.`;
    return;
  }
  if (/TOOL run_substage\(/.test(text)) {
    const li = openSubstages.shift();
    if (li) li.classList.add('done');
  }
}

function setDot(el, state) {
  el.className = 'dot ' + state;
}

async function pollHealth() {
  try {
    const r = await fetch(`${API}/health`, { cache: 'no-store' });
    if (!r.ok) throw new Error('health http ' + r.status);
    const h = await r.json();
    setDot(dotApi, h.api === 'ok' ? 'ok' : 'down');
    setDot(dotOllama, h.ollama === 'ok' ? 'ok' : 'down');
    setDot(dotRunner, h.stage_runner === 'ok' ? 'ok' : 'missing');
  } catch (e) {
    // API selbst nicht erreichbar -- alles unbekannt/down, keine Folgeschluesse moeglich.
    setDot(dotApi, 'down');
    setDot(dotOllama, 'down');
    setDot(dotRunner, 'down');
  }
}

loadPrefs();
applyPanelState(safeLocalStorage(() => localStorage.getItem('reaper_panel_open'), null) === '1');
ensureSession();
pollHealth();
setInterval(pollHealth, HEALTH_POLL_MS);
</script>
