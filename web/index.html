<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaper</title>
<style>
  :root {
    --bg: #f5f5f3;
    --panel: #ffffff;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --border: #e0ddd6;
    --accent: #8a6a4a;
    --accent-text: #ffffff;
    --user-bubble: #e9e5dc;
    --stage-bubble: #ffffff;
    --error: #b4433a;
    --success: #4a7a4a;
    --warn: #a9802e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #26241f;
      --text: #ece8e0;
      --text-dim: #9a958a;
      --border: #3a372f;
      --accent: #c9a876;
      --accent-text: #1c1b19;
      --user-bubble: #332f27;
      --stage-bubble: #26241f;
      --error: #e07a6f;
      --success: #7fc17f;
      --warn: #d9ac55;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 0 0 auto; }
  header .session-id { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  header .spacer { flex: 1; }

  #health { display: flex; gap: 10px; align-items: center; }
  #health .hitem { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
  #health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); flex: 0 0 auto; }
  #health .dot.ok { background: var(--success); }
  #health .dot.down, #health .dot.missing { background: var(--error); }
  #health .dot.checking { background: var(--warn); }
  select, input[type=text] {
    font-size: 12px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
  }
  label.opt { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
  button {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--error); border-color: var(--error); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 72ch; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.stage { align-self: flex-start; background: var(--stage-bubble); border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--text-dim); margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.success { color: var(--success); border-color: var(--success); }
  .badge.error, .badge.wall_clock, .badge.max_iterations { color: var(--error); border-color: var(--error); }
  .badge.aborted, .badge.watchdog_timeout, .badge.incomplete { color: var(--warn); border-color: var(--warn); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; font-size: 11px; color: var(--text-dim); }
  details.raw pre { font-size: 11px; white-space: pre-wrap; color: var(--text-dim); max-height: 240px; overflow-y: auto; }

  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #composer textarea {
    flex: 1;
    resize: none;
    min-height: 40px;
    max-height: 160px;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #status-line { font-size: 12px; color: var(--text-dim); padding: 0 16px 8px; min-height: 16px; }
  .err { color: var(--error); }
</style>
</head>
<body>

<header>
  <h1>Reaper</h1>
  <span class="session-id" id="session-id">-</span>
  <div id="health">
    <span class="hitem"><span class="dot checking" id="dot-api"></span>API</span>
    <span class="hitem"><span class="dot checking" id="dot-ollama"></span>Ollama</span>
    <span class="hitem"><span class="dot checking" id="dot-runner"></span>Runner</span>
  </div>
  <div class="spacer"></div>
  <label class="opt">Modell
    <select id="model">
      <option value="qwen3.8-q5:latest">qwen3.8-q5:latest (Haupt)</option>
      <option value="qwen3:8b">qwen3:8b (schnell)</option>
    </select>
  </label>
  <label class="opt">Projekt <input type="text" id="project" value="coding-v2" size="10"></label>
  <label class="opt"><input type="checkbox" id="think"> Reasoning</label>
  <button id="new-session">Neue Session</button>
</header>

<div id="log"></div>
<div id="status-line"></div>

<div id="composer">
  <textarea id="input" placeholder="Nachricht an Reaper ..." rows="1"></textarea>
  <button id="abort" class="danger" style="display:none">Abbrechen</button>
  <button id="send" class="primary">Senden</button>
</div>

<script>
const API = location.origin;
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status-line');
const sessionIdEl = document.getElementById('session-id');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const abortBtn = document.getElementById('abort');
const newSessionBtn = document.getElementById('new-session');
const modelSel = document.getElementById('model');
const projectInput = document.getElementById('project');
const thinkBox = document.getElementById('think');

let sessionId = null;
let stageRunning = false;

function safeLocalStorage(fn, fallback) {
  try { return fn(); } catch (e) { return fallback; }
}

function loadPrefs() {
  const model = safeLocalStorage(() => localStorage.getItem('reaper_model'), null);
  const project = safeLocalStorage(() => localStorage.getItem('reaper_project'), null);
  const think = safeLocalStorage(() => localStorage.getItem('reaper_think'), null);
  if (model) modelSel.value = model;
  if (project) projectInput.value = project;
  if (think !== null) thinkBox.checked = think === '1';
}
function savePrefs() {
  safeLocalStorage(() => {
    localStorage.setItem('reaper_model', modelSel.value);
    localStorage.setItem('reaper_project', projectInput.value);
    localStorage.setItem('reaper_think', thinkBox.checked ? '1' : '0');
  }, null);
}
[modelSel, projectInput, thinkBox].forEach(el => el.addEventListener('change', savePrefs));

function setStatus(text, isError) {
  statusEl.textContent = text || '';
  statusEl.className = isError ? 'err' : '';
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function addStageMessage() {
  const div = document.createElement('div');
  div.className = 'msg stage';
  div.innerHTML = '<span class="body">...</span><div class="meta"><span class="badge running">läuft</span></div>';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function updateStageMessage(div, stage) {
  const body = div.querySelector('.body');
  const meta = div.querySelector('.meta');
  body.textContent = stage.summary || '(keine Zusammenfassung)';
  const badge = `<span class="badge ${stage.status}">${stage.status}</span>`;
  const dur = stage.duration_s != null ? `<span>${stage.duration_s}s</span>` : '';
  meta.innerHTML = badge + dur;
  if (stage.stderr_tail) {
    const details = document.createElement('details');
    details.className = 'raw';
    details.innerHTML = `<summary>Details</summary><pre></pre>`;
    details.querySelector('pre').textContent = stage.stderr_tail;
    div.appendChild(details);
  }
}

async function ensureSession() {
  const saved = safeLocalStorage(() => localStorage.getItem('reaper_session_id'), null);
  if (saved) {
    try {
      const r = await fetch(`${API}/sessions/${saved}`);
      if (r.ok) {
        sessionId = saved;
        const data = await r.json();
        renderHistory(data);
        sessionIdEl.textContent = sessionId;
        return;
      }
    } catch (e) { /* fall through to new session */ }
  }
  await createSession();
}

async function createSession() {
  const r = await fetch(`${API}/sessions`, { method: 'POST' });
  const data = await r.json();
  sessionId = data.session_id;
  safeLocalStorage(() => localStorage.setItem('reaper_session_id', sessionId), null);
  sessionIdEl.textContent = sessionId;
  logEl.innerHTML = '';
  setStatus('');
}

function renderHistory(session) {
  logEl.innerHTML = '';
  const stagesById = {};
  (session.stages || []).forEach(s => { stagesById[s.stage_id] = s; });
  (session.messages || []).forEach(m => {
    addUserMessage(m.content);
    const stage = stagesById[m.stage_id];
    if (stage) {
      const div = addStageMessage();
      updateStageMessage(div, stage);
    }
  });
}

newSessionBtn.addEventListener('click', async () => {
  if (stageRunning) return;
  await createSession();
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);
abortBtn.addEventListener('click', async () => {
  if (!sessionId) return;
  abortBtn.disabled = true;
  try {
    await fetch(`${API}/sessions/${sessionId}/abort`, { method: 'POST' });
  } catch (e) { setStatus('Abbruch fehlgeschlagen: ' + e, true); }
  abortBtn.disabled = false;
});

async function sendMessage() {
  const text = input.value.trim();
  if (!text || stageRunning || !sessionId) return;
  input.value = '';
  input.style.height = 'auto';
  addUserMessage(text);
  const stageDiv = addStageMessage();

  stageRunning = true;
  sendBtn.disabled = true;
  abortBtn.style.display = 'inline-block';
  setStatus('Verbinde ...');

  const body = {
    message: text,
    model: modelSel.value,
    project: projectInput.value || 'coding-v2',
    think: thinkBox.checked,
  };

  try {
    const resp = await fetch(`${API}/sessions/${sessionId}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (resp.status === 409) {
      setStatus('Es läuft bereits eine Stage in dieser Session.', true);
      stageDiv.remove();
      return;
    }
    if (!resp.ok) {
      const errBody = await resp.text();
      setStatus(`Fehler ${resp.status}: ${errBody}`, true);
      stageDiv.remove();
      return;
    }
    await readSseStream(resp.body, stageDiv);
  } catch (e) {
    setStatus('Verbindung verloren: ' + e, true);
  } finally {
    stageRunning = false;
    sendBtn.disabled = false;
    abortBtn.style.display = 'none';
  }
}

async function readSseStream(bodyStream, stageDiv) {
  const reader = bodyStream.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const frame = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      handleSseFrame(frame, stageDiv);
    }
  }
  setStatus('');
}

function handleSseFrame(frame, stageDiv) {
  let eventType = 'message';
  let dataLine = null;
  frame.split('\n').forEach(line => {
    if (line.startsWith('event:')) eventType = line.slice(6).trim();
    else if (line.startsWith('data:')) dataLine = line.slice(5).trim();
  });
  if (!dataLine) return;
  let data;
  try { data = JSON.parse(dataLine); } catch (e) { return; }

  if (eventType === 'stage_started') {
    setStatus(`Gestartet (pid ${data.pid}) ...`);
  } else if (eventType === 'heartbeat') {
    setStatus(`läuft seit ${data.elapsed_s}s ...`);
  } else if (eventType === 'stage_completed') {
    updateStageMessage(stageDiv, data);
    setStatus('');
  }
  logEl.scrollTop = logEl.scrollHeight;
}

const HEALTH_POLL_MS = 5000;
const dotApi = document.getElementById('dot-api');
const dotOllama = document.getElementById('dot-ollama');
const dotRunner = document.getElementById('dot-runner');

function setDot(el, state) {
  el.className = 'dot ' + state;
}

async function pollHealth() {
  try {
    const r = await fetch(`${API}/health`, { cache: 'no-store' });
    if (!r.ok) throw new Error('health http ' + r.status);
    const h = await r.json();
    setDot(dotApi, h.api === 'ok' ? 'ok' : 'down');
    setDot(dotOllama, h.ollama === 'ok' ? 'ok' : 'down');
    setDot(dotRunner, h.stage_runner === 'ok' ? 'ok' : 'missing');
  } catch (e) {
    // API selbst nicht erreichbar -- alles unbekannt/down, keine Folgeschluesse moeglich.
    setDot(dotApi, 'down');
    setDot(dotOllama, 'down');
    setDot(dotRunner, 'down');
  }
}

loadPrefs();
ensureSession();
pollHealth();
setInterval(pollHealth, HEALTH_POLL_MS);
</script>

</body>
</html>
